name: DAST Scan (OWASP ZAP)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *" # optioneel: elke nacht

jobs:
  dast:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run ZAP Baseline Scan (No Auth)
        uses: zaproxy/action-baseline@v0.9.0
        continue-on-error: true
        with:
          target: "https://avanskeuzekompas.onrender.com"
          fail_action: false
          cmd_options: >
            -H "Authorization: Bearer ${{ secrets.ZAP_AUTH_TOKEN }}"
          
      - name: Upload ZAP reports
        uses: actions/upload-artifact@v4
        with:
          name: zap-reports
          path: |
            report_json.json
            report_md.md
            report_html.html
