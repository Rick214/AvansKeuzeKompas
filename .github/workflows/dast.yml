name: DAST Scan (OWASP ZAP)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *" # optioneel: elke nacht

jobs:
  dast:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run ZAP Baseline Scan (No Auth)
        uses: zaproxy/action-baseline@v0.9.0
        with:
          target: "https://avanskeuzekompas.onrender.com" # jouw app URL
          fail_action: false        # pipeline faalt niet bij warnings
          artifact_name: "zap-reports" # maakt automatisch zip van reports
          cmd_options: ""           # geen extra CLI opties nodig

      - name: Upload ZAP artifact
        uses: actions/upload-artifact@v4
        with:
          name: zap-reports
          path: |
            report_json.json
            report_md.md
            report_html.html


